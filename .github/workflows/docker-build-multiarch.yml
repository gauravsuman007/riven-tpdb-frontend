name: Build Docker Images (multi-arch)

on:
  push:
    branches:
      - main
      - 'ci/**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    # Docs cannot change the image. NOTE: this also applies to tag pushes --
    # cut release tags on a commit that touches code, or use workflow_dispatch.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# Rapid successive pushes supersede each other rather than queueing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # One job per architecture on a NATIVE runner. Emulating arm64 under QEMU on
  # an amd64 host is many times slower for a pnpm/vite build.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # NO layer cache, deliberately -- it cost more than it saved.
          #
          # Measured per arch on a real build: `cache export` took 24.7s and
          # produced exactly ONE cache hit on the next run. The only layers
          # worth reusing are the base image and `pnpm install` (7.9s), while
          # `mode=max` also exported the post-build layer -- node_modules plus
          # the Vite output, hundreds of megabytes -- which can never be
          # reused, because the `COPY . .` above it changes on every commit.
          #
          # So it spent ~25s each build to save ~8s on some builds. The rest
          # of the time is `vite build` (77-82s), which no layer cache can
          # help with because the source is exactly what changed.
          #
          # Reinstate this only alongside a measurement showing a real hit
          # rate; the tempting `mode=max` is what makes it net-negative here.
          # riven-tpdb keeps its cache, where `uv sync` is genuinely expensive
          # and its dependencies rarely change.

      - name: Export digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
